name: 发布 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 下载并安装 Gradle 8.5（绕过 wrapper 下载问题）
        run: |
          curl -fL --retry 3 -o /tmp/gradle-8.5-bin.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q /tmp/gradle-8.5-bin.zip -d /opt
          /opt/gradle-8.5/bin/gradle --version

      - name: 构建 Release APK
        run: /opt/gradle-8.5/bin/gradle assembleRelease --no-daemon

      - name: 重命名 APK（附带版本号）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/ApkAdRemoverEditor-v${VERSION}.apk"

      - name: 获取 release-drafter 草稿说明
        id: draft
        run: |
          BODY=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=5" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(next((r.get('body','') for r in d if r.get('draft')), ''))")
          if [ -z "$BODY" ]; then
            BODY=$'## 变更内容\n\n本版本由 GitHub Actions 自动构建发布。'
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/ApkAdRemoverEditor-v*.apk
          body: ${{ steps.draft.outputs.body }}
          fail_on_unmatched_files: true
