name: CI 构建

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 Debug + Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 下载并安装 Gradle 8.5（绕过 wrapper 下载问题）
        run: |
          curl -fL --retry 3 -o /tmp/gradle-8.5-bin.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q /tmp/gradle-8.5-bin.zip -d /opt
          /opt/gradle-8.5/bin/gradle --version

      - name: 构建 Debug APK
        run: /opt/gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: 构建 Release APK
        run: /opt/gradle-8.5/bin/gradle assembleRelease --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
