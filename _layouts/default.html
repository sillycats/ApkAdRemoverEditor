<!DOCTYPE html>
<html lang="{{ site.lang | default: "zh-CN" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a id="skip-to-content" href="#content" class="sr-only">Skip to the content.</a>

    <header class="page-header" role="banner">
      <h1 class="project-name">{{ site.title | default: site.github.repository_name }}</h1>
      <h2 class="project-tagline">{{ site.description | default: site.github.project_tagline }}</h2>
      <a href="{{ site.github.repository_url }}" class="btn">📦 GitHub 仓库</a>
      <a href="{{ site.github.zip_url }}" class="btn">📥 下载 APK</a>
      <a href="{{ site.github.tar_url }}" class="btn">💬 社区讨论</a>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}
      <footer class="site-footer">
        <span class="site-footer-owner">由 <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a> 维护 · 基于 <a href="{{ site.github.repository_url }}/blob/main/LICENSE">MIT License</a> 开源</span>
      </footer>
    </main>
  </body>
</html>
